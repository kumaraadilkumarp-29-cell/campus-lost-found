<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · Campus Lost &amp; Found</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230e7c66%27/%3E%3Cpath d=%27M10 13h12l-1.6 10.5a2 2 0 0 1-2 1.5h-4.8a2 2 0 0 1-2-1.5z%27 fill=%27%23f7f4ed%27/%3E%3Cpath d=%27M13 13a3 3 0 0 1 6 0%27 stroke=%27%23f7f4ed%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="admin">
  <header class="site-header" id="site-header"></header>
  <main id="main" class="page">
    <div class="container">
      <div class="row-between" style="margin-bottom: 26px">
        <div>
          <p class="eyebrow">Security desk</p>
          <h1 style="margin-bottom: 4px">Administration</h1>
          <p class="muted" style="margin: 0">Every listing, claim and account on the campus register.</p>
        </div>
        <button class="btn btn-outline btn-sm" id="refresh-btn" type="button">Refresh data</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Listings</div><div class="stat-value" id="stat-items">—</div><div class="stat-note" id="note-items">&nbsp;</div></div>
        <div class="stat-card"><div class="stat-label">Lost reports</div><div class="stat-value lost" id="stat-lost">—</div><div class="stat-note" id="note-lost">&nbsp;</div></div>
        <div class="stat-card"><div class="stat-label">Found reports</div><div class="stat-value found" id="stat-found">—</div><div class="stat-note" id="note-found">&nbsp;</div></div>
        <div class="stat-card"><div class="stat-label">Recovery rate</div><div class="stat-value" id="stat-recovery">—</div><div class="stat-note" id="note-recovery">&nbsp;</div></div>
      </div>

      <div class="chart-grid" style="margin-bottom: 30px">
        <div class="panel">
          <div class="panel-head"><h3>Listings by category</h3></div>
          <div id="chart-category"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Listings by status</h3></div>
          <div id="chart-status"></div>
        </div>
        <div class="panel" style="grid-column: 1 / -1">
          <div class="panel-head"><h3>New reports · last 7 days</h3><span class="muted small" id="activity-total"></span></div>
          <div id="chart-activity"></div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Admin sections">
        <button class="tab" role="tab" id="atab-items" aria-controls="apanel-items" aria-selected="true">Listings</button>
        <button class="tab" role="tab" id="atab-claims" aria-controls="apanel-claims" aria-selected="false">Claims</button>
        <button class="tab" role="tab" id="atab-users" aria-controls="apanel-users" aria-selected="false">Users</button>
      </div>

      <section class="tab-panel" id="apanel-items" role="tabpanel" aria-labelledby="atab-items"><div id="admin-items"></div></section>
      <section class="tab-panel" id="apanel-claims" role="tabpanel" aria-labelledby="atab-claims" hidden><div id="admin-claims"></div></section>
      <section class="tab-panel" id="apanel-users" role="tabpanel" aria-labelledby="atab-users" hidden><div id="admin-users"></div></section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <div class="toast-stack" id="toast-stack"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
